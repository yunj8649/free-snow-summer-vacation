<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>여름 정모 레크레이션</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <img class="logo" src="./logo.jpg" alt="프리스노우 로고">
  <h1>🏖️ 여름 정모 레크레이션 ☀️</h1>
  <div class="sub">Free Snow Summer · 총점 120점 · 팀 대항전</div>
</header>
<nav>
  <button data-tab="schedule" class="active">진행 순서</button>
  <button data-tab="teams">팀</button>
  <button data-tab="score">점수판</button>
  <button data-tab="bgm">🎵 BGM</button>
</nav>
<main>
  <section id="schedule" class="active">
    <div class="card">
      <div id="sched"></div>
      <p class="hint">각 게임은 <b>공개</b>를 누를 때만 내용이 보여요. 진행할 때 하나씩 발표하세요.</p>
    </div>
  </section>

  <section id="teams">
    <div class="card">
      <div class="row">
        <div style="width:140px">
          <label>팀 갯수</label>
          <input type="number" id="teamCount" min="2" max="12" value="4">
        </div>
        <button class="btn g" id="buildTeams">칸 만들기</button>
        <button class="btn p" id="saveTeams">저장</button>
      </div>
      <p class="hint" id="teamMeta"></p>
      <div id="teamEdit" style="margin-top:12px"></div>
    </div>
  </section>

  <section id="score">
    <div class="card">
      <div id="noTeams" class="hint">먼저 <b>팀</b> 탭에서 팀을 저장해 주세요.</div>
      <div style="overflow-x:auto">
        <table class="sb"><thead id="sbHead"></thead><tbody id="sbBody"></tbody></table>
      </div>
      <div class="win" id="winner"></div>
      <p class="hint" id="scoreHint"></p>
    </div>
  </section>

  <section id="bgm">
    <div class="card">
      <label>🎬 상황별 유튜브 배경음 (저장됨)</label>
      <div id="ytList"></div>
      <div class="bgm-opts" style="margin-top:8px">
        <button class="btn g sm" id="ytAdd">+ 슬롯 추가</button>
        <label class="btn g sm" style="cursor:pointer; margin:0">📂 내 음악<input type="file" accept="audio/*" id="bgmFile" style="display:none"></label>
      </div>
      <label style="margin-top:12px">볼륨</label>
      <input type="range" id="bgmVol" min="0" max="1" step="0.05" value="0.5">
      <p class="hint">여기서 라벨·링크를 저장하면, <b>어느 화면에서든 오른쪽 위 🎵 버튼</b>으로 골라 틀 수 있어요. (소리는 버튼 누른 뒤부터, 일부 영상은 임베드 차단으로 안 될 수 있어요.)</p>
    </div>
  </section>

  <footer style="text-align:center; padding:10px 0 30px">
    <button class="btn g sm" id="resetAll">🗑 데이터 초기화 (팀·점수·공개상태)</button>
  </footer>
</main>

<script src="data.js"></script>
<script src="bgm.js"></script>
<script src="bgmbar.js"></script>
<script>
/* ---------- state ---------- */
const KEY='fss2026b'; // 게임 구성 변경으로 저장키 갱신(기존 저장값 초기화)
const load=()=>{ try{return JSON.parse(localStorage.getItem(KEY))||{}}catch{return{}} };
const save=s=>localStorage.setItem(KEY,JSON.stringify(s));
let state=load(); // {teams:[{name}], scores:[[..게임수]], cheer:[숫자], revealed:[bool]}
if(!state.revealed) state.revealed=GAMES.map(()=>false);
if(!state.cheer) state.cheer=[];
const CHEER_SCORE=10; // 📣 응원(분위기) 보너스 최대 점수

/* ---------- tabs ---------- */
function activate(id){
  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active', x.dataset.tab===id));
  document.querySelectorAll('section').forEach(x=>x.classList.toggle('active', x.id===id));
  document.querySelector('footer').style.display=id==='schedule'?'':'none'; // 초기화는 메인에서만
  window.scrollTo(0,0);
  if(id==='score') renderScore();
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>activate(b.dataset.tab));
document.getElementById('resetAll').onclick=()=>{
  if(confirm('팀·점수·공개 상태를 모두 초기화할까요?')){ localStorage.removeItem(KEY); location.reload(); }
};

/* ---------- schedule (reveal one by one -> jump to game) ---------- */
function renderSched(){
  document.getElementById('sched').innerHTML = GAMES.map((g,i)=>{
    const shown=state.revealed[i];
    const body = shown
      ? `<div class="body">${g.emoji} ${g.name}</div>`
      : `<div class="body"><span class="hidden-label">? ? ?</span></div>`;
    const label = !shown ? '공개' : (g.tab ? '게임 열기 ▶' : '숨기기');
    return `<div class="sched-item"><div class="no">${i+1}</div>${body}
      <button class="btn ${shown&&!g.tab?'g':'p'} sm" data-i="${i}">${label}</button></div>`;
  }).join('');
  document.querySelectorAll('#sched button').forEach(btn=>btn.onclick=()=>{
    const i=+btn.dataset.i, g=GAMES[i];
    if(!state.revealed[i]){ state.revealed[i]=true; save(state); renderSched(); } // 1번째: 공개
    else if(g.tab){ location.href = g.tab + '.html'; }                            // 화면 게임: 해당 페이지로 이동
    else { state.revealed[i]=false; save(state); renderSched(); }                 // 오프라인 게임: 다시 숨기기
  });
}

/* ---------- teams (manual input) ---------- */
function buildTeamInputs(count, existing){
  const el=document.getElementById('teamEdit');
  el.innerHTML='';
  for(let i=0;i<count;i++){
    const t=existing&&existing[i];
    const div=document.createElement('div');
    div.className='teamEdit';
    div.innerHTML=`<div class="row"><input class="tname" style="max-width:260px" value="${t?t.name:(i+1)+'팀'}"></div>`;
    el.appendChild(div);
  }
}
function collectTeams(){
  const rows=document.querySelectorAll('#teamEdit .teamEdit');
  return [...rows].map(r=>({ name:r.querySelector('.tname').value.trim()||'팀' }));
}
document.getElementById('buildTeams').onclick=()=>{
  const n=Math.max(2,Math.min(12,+document.getElementById('teamCount').value||2));
  buildTeamInputs(n, state.teams);
};
document.getElementById('saveTeams').onclick=()=>{
  const teams=collectTeams();
  // keep existing scores by index, resize to team count
  const old=state.scores||[];
  state.teams=teams;
  state.scores=teams.map((_,i)=> old[i] ? old[i] : GAMES.map(()=>0));
  const oldC=state.cheer||[]; state.cheer=teams.map((_,i)=> +oldC[i]||0);
  save(state);
  document.getElementById('teamMeta').textContent=`저장됨 · ${teams.length}팀`;
  renderScore();
};

/* ---------- scoreboard ---------- */
function renderScore(){
  const no=document.getElementById('noTeams');
  if(!state.teams||!state.teams.length){ no.style.display='block';
    document.getElementById('sbHead').innerHTML=''; document.getElementById('sbBody').innerHTML='';
    document.getElementById('winner').innerHTML=''; return; }
  no.style.display='none';
  document.getElementById('sbHead').innerHTML=
    `<tr><th>팀</th>${GAMES.map(g=>`<th>${g.emoji}<br><span class="hint">${g.score}</span></th>`).join('')}<th>📣<br><span class="hint">응원 ${CHEER_SCORE}</span></th><th>합계</th></tr>`;
  const totals=state.teams.map((_,ti)=>state.scores[ti].reduce((a,b)=>a+(+b||0),0)+(+state.cheer[ti]||0));
  const ranked=[...totals].map((t,i)=>({t,i})).sort((a,b)=>b.t-a.t);
  const rankOf={}; let prev=null,r=0;
  ranked.forEach((o,idx)=>{ if(o.t!==prev){r=idx+1;prev=o.t;} rankOf[o.i]=o.t>0?r:0; });
  document.getElementById('sbBody').innerHTML=state.teams.map((t,ti)=>
    `<tr class="rank${rankOf[ti]}"><td>${t.name}</td>${GAMES.map((g,gi)=>
       `<td><input type="number" min="0" max="${g.score}" value="${state.scores[ti][gi]||0}" data-t="${ti}" data-g="${gi}">
          <label class="wincheck"><input type="checkbox" data-t="${ti}" data-g="${gi}" ${(+state.scores[ti][gi]||0)===g.score?'checked':''}>이김</label></td>`
       ).join('')}<td><input type="number" class="cheer" min="0" max="${CHEER_SCORE}" value="${+state.cheer[ti]||0}" data-t="${ti}">
          <label class="wincheck"><input type="checkbox" class="cheer" data-t="${ti}" ${(+state.cheer[ti]||0)===CHEER_SCORE?'checked':''}>만점</label></td><td class="total">${totals[ti]}</td></tr>`
  ).join('');
  document.querySelectorAll('.sb input[type=number]:not(.cheer)').forEach(inp=>inp.oninput=()=>{
    let v=Math.max(0,+inp.value||0); const cap=GAMES[+inp.dataset.g].score;
    if(v>cap){v=cap; inp.value=cap;}
    state.scores[+inp.dataset.t][+inp.dataset.g]=v; save(state); renderScore();
  });
  document.querySelectorAll('.sb input[type=checkbox]:not(.cheer)').forEach(cb=>cb.onchange=()=>{
    state.scores[+cb.dataset.t][+cb.dataset.g] = cb.checked ? GAMES[+cb.dataset.g].score : 0;
    save(state); renderScore();
  });
  document.querySelectorAll('.sb input.cheer[type=number]').forEach(inp=>inp.oninput=()=>{
    let v=Math.max(0,Math.min(CHEER_SCORE,+inp.value||0)); inp.value=v;
    state.cheer[+inp.dataset.t]=v; save(state); renderScore();
  });
  document.querySelectorAll('.sb input.cheer[type=checkbox]').forEach(cb=>cb.onchange=()=>{
    state.cheer[+cb.dataset.t]= cb.checked?CHEER_SCORE:0; save(state); renderScore();
  });
  const max=Math.max(...totals);
  const done=GAMES.every((g,gi)=>state.teams.some((_,ti)=>(+state.scores[ti][gi]||0)>0)); // 모든 게임에 점수 반영됨
  document.getElementById('winner').innerHTML =
    (done && max>0) ? `🏆 우승: ${state.teams.map((t,i)=>totals[i]===max?t.name:'').filter(Boolean).join(', ')} (${max}점)` : '';
  if(done && max>0){ if(!renderScore._won){ renderScore._won=true; celebrate(); } }
  else renderScore._won=false;
  document.getElementById('scoreHint').textContent='점수를 직접 입력하거나 "이김"을 체크하면 그 게임 배점만큼 자동 반영돼요.';
}
// 우승 축하 컨페티
function celebrate(){
  const colors=['#ffb703','#ff9e00','#ef476f','#06a86b','#2aa9e0','#0fb5a6','#ffd23f'];
  for(let i=0;i<100;i++){
    const s=document.createElement('div'); s.className='confetti';
    s.style.left=Math.random()*100+'vw';
    s.style.background=colors[i%colors.length];
    s.style.animationDelay=(Math.random()*0.7)+'s';
    s.style.animationDuration=(2.4+Math.random()*1.4)+'s';
    s.style.width=(7+Math.random()*8)+'px';
    document.body.appendChild(s);
    setTimeout(()=>s.remove(), 4200);
  }
}

/* ---------- BGM (편집: 저장/삭제, 재생은 우측 상단 🎵 바에서) ---------- */
document.getElementById('bgmFile').onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  if(window.bgmbarStop) bgmbarStop();
  BGM.playFile(URL.createObjectURL(f));
};
document.getElementById('bgmVol').oninput=e=>BGM.setVolume(+e.target.value);

/* 상황별 유튜브 배경음 (localStorage 저장) */
const BKEY='fss_bgm';
let bgmList;
try{ bgmList=JSON.parse(localStorage.getItem(BKEY)); }catch(e){}
if(!Array.isArray(bgmList)) bgmList=[
  {label:'대기', url:'https://youtu.be/_Xlxhxp_sa0'},
  {label:'레제', url:'https://youtu.be/GvvyPj73UEM'},
  {label:'게임 진행 1', url:'https://youtu.be/l7RTrlaE0VE'},
  {label:'게임 진행 2', url:'https://youtu.be/ceYtWuWIOoE'},
  {label:'점수 공개', url:'https://youtu.be/KHdtQsQZP0w'},
  {label:'게임쇼', url:'https://youtu.be/KEWvo0uGy-o'},
];
const saveBgm=()=>localStorage.setItem(BKEY, JSON.stringify(bgmList));
if(!localStorage.getItem(BKEY)){ saveBgm(); if(window.bgmbarRefresh) bgmbarRefresh(); } // default 목록을 저장해 플로팅 바에도 노출
const esc=s=>String(s).replace(/"/g,'&quot;');
function renderBgmList(){
  const el=document.getElementById('ytList'); el.innerHTML='';
  bgmList.forEach((it,idx)=>{
    const row=document.createElement('div'); row.className='row'; row.style.marginBottom='8px';
    row.innerHTML=`<input class="lbl" value="${esc(it.label)}" style="max-width:130px">
      <input class="url" placeholder="유튜브 링크" value="${esc(it.url)}" style="flex:1; min-width:150px">
      <button class="btn p sm play">▶</button>
      <button class="btn g sm del">🗑</button>
      <button class="btn g sm open">↗ 이동</button>`;
    row.querySelector('.lbl').onchange=e=>{ bgmList[idx].label=e.target.value; saveBgm(); if(window.bgmbarRefresh) bgmbarRefresh(); };
    row.querySelector('.url').onchange=e=>{ bgmList[idx].url=e.target.value; saveBgm(); if(window.bgmbarRefresh) bgmbarRefresh(); };
    row.querySelector('.open').onclick=()=>{ const u=row.querySelector('.url').value.trim(); if(u) window.open(u,'_blank'); };
    row.querySelector('.play').onclick=()=>{
      const url=row.querySelector('.url').value;
      const id=BGM.ytId(url);
      if(!id){ alert('유효한 유튜브 링크가 아니에요.'); return; }
      bgmList[idx].url=url; saveBgm();
      if(window.bgmbarPlay){ bgmbarPlay(url); } // 우측 상단 바로 재생
    };
    row.querySelector('.del').onclick=()=>{ bgmList.splice(idx,1); saveBgm(); renderBgmList(); if(window.bgmbarRefresh) bgmbarRefresh(); };
    el.appendChild(row);
  });
}
document.getElementById('ytAdd').onclick=()=>{ bgmList.push({label:'새 배경음', url:''}); saveBgm(); renderBgmList(); if(window.bgmbarRefresh) bgmbarRefresh(); };
renderBgmList();

/* ---------- init ---------- */
renderSched();
if(state.teams&&state.teams.length){ buildTeamInputs(state.teams.length, state.teams);
  document.getElementById('teamCount').value=state.teams.length; }
else buildTeamInputs(4);
renderScore();
</script>
</body>
</html>
