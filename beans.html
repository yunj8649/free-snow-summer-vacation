<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>콩 옮기기</title>
<link rel="stylesheet" href="style.css">
<style>
  .matchbox{ display:flex; flex-direction:column; gap:12px; margin-top:18px; }
  .matchcard{ display:flex; align-items:center; justify-content:center; gap:14px; background:#f7fdff; border:2px solid var(--line); border-radius:16px; padding:16px 14px; box-shadow:0 3px 10px rgba(14,58,82,.08); animation:pop .25s ease; }
  .matchcard .mno{ background:linear-gradient(135deg,var(--teal),var(--sky)); color:#fff; border-radius:12px; padding:5px 11px; font-size:.85rem; font-weight:900; white-space:nowrap; }
  .matchcard .mteam{ font-size:1.3rem; font-weight:900; }
  .matchcard .vs{ color:var(--hot); font-weight:900; font-size:1.05rem; }
  .matchcard .bye{ color:var(--mut); font-size:1rem; font-weight:800; }
  @keyframes pop{ from{ transform:scale(.85); opacity:0; } to{ transform:scale(1); opacity:1; } }
</style>
</head>
<body>
<main class="gamepage">
  <div class="card">
    <a class="btn g sm back-link" href="./index.html">← 진행 순서</a>
    <div class="stage" id="beanStage"></div>
    <div class="stage" id="timerStage" hidden></div>
  </div>
</main>
<script src="bgm.js"></script>
<script src="bgmbar.js"></script>
<script>
(function(){
  const el=document.getElementById('beanStage');
  const TOOLS=['쇠젓가락','장대 젓가락','나무젓가락','집게','이쑤시개','빨대','티스푼','빨래집게'];
  const TEAMC=[{pill:'#d6f5f1',text:'#0a7d72'},{pill:'#ffe0e8',text:'#c02b4e'},{pill:'#d9f0fb',text:'#1b6a92'},{pill:'#fff0cc',text:'#a9720a'},{pill:'#e6e0fb',text:'#5b45c0'},{pill:'#e2f6d8',text:'#3f7d1e'}];
  function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
  function loadTeams(){ try{ const s=JSON.parse(localStorage.getItem('fss2026b')); if(s&&Array.isArray(s.teams)&&s.teams.length) return s.teams.map((t,i)=>(t&&t.name&&t.name.trim())||`${i+1}팀`); }catch(e){} return null; }
  function render(){
    el.innerHTML=`
      <div class="badge">콩 옮기기</div>
      <p class="hint">각 팀에 아래 도구들을 나눠주세요. 팀 안에서 누가 어떤 도구를 쓸지는 자유롭게 정하면 돼요!<br>2팀씩 짝지어 진행하고, <b>콩을 가장 많이 옮긴 한 팀이 우승</b>이에요.</p>
      <div style="display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin:16px 0;">
        ${TOOLS.map(t=>`<span style="background:#eafaff; border:2px solid var(--line); color:var(--ink); font-weight:800; padding:10px 16px; border-radius:20px; font-size:1.05rem;">${t}</span>`).join('')}
      </div>
      <div class="ctrl" style="justify-content:center;">
        <button class="btn p sm draw">🎲 대진 뽑기</button>
        <button class="btn g sm totimer">순서 타이머 ▶</button>
      </div>
      <div id="drawres" class="resgrid"></div>`;
    el.querySelector('.totimer').onclick=()=>{ el.hidden=true; document.getElementById('timerStage').hidden=false; };
    el.querySelector('.draw').onclick=drawBracket;
  }
  function drawBracket(){
    const names=loadTeams();
    const box=el.querySelector('#drawres'); box.className='matchbox'; box.innerHTML='';
    if(!names){ box.className=''; box.innerHTML='<p class="hint">홈 화면에서 팀을 먼저 설정하세요.</p>'; return; }
    const btn=el.querySelector('.draw'); btn.disabled=true;
    const order=shuffle(names.map((n,i)=>({n,i})));
    const matches=[];
    for(let i=0;i<order.length;i+=2){ matches.push([order[i], order[i+1]||null]); }
    matches.forEach((m,k)=>{
      setTimeout(()=>{
        const a=m[0], b=m[1];
        const card=document.createElement('div'); card.className='matchcard';
        const A=`<span class="mteam" style="color:${TEAMC[a.i%TEAMC.length].text}">${a.n}</span>`;
        card.innerHTML = b
          ? `<span class="mno">${k+1}경기</span>${A}<span class="vs">VS</span><span class="mteam" style="color:${TEAMC[b.i%TEAMC.length].text}">${b.n}</span>`
          : `<span class="mno">${k+1}경기</span>${A}<span class="bye">부전승</span>`;
        box.appendChild(card);
        if(k===matches.length-1) btn.disabled=false;
      }, k*500);
    });
  }
  render();
})();
</script>
<script>
/* 일렬 순서 진행 타이머: 1명씩 정해진 시간(기본 20초) 카운트다운, 0초 되면 삐 소리 + 다음 사람으로 자동 넘김, 마지막이면 처음으로 순환 */
(function(){
  const el=document.getElementById('timerStage');
  let people=8, secs=20, cur=0, remain=20, running=false, tick=null;
  function beep(){ try{
    const ac=new (window.AudioContext||window.webkitAudioContext)();
    // 삐-삐-삐 3연타 알람 (더 크고 눈에 띄게)
    for(let k=0;k<3;k++){
      const t=ac.currentTime+k*0.22, o=ac.createOscillator(), g=ac.createGain();
      o.connect(g); g.connect(ac.destination); o.type='square'; o.frequency.value=1046;
      g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.7,t+0.01);
      g.gain.exponentialRampToValueAtTime(.0001,t+0.18);
      o.start(t); o.stop(t+0.2);
    }
  }catch(e){} }
  function mmss(s){ const m=Math.floor(s/60), ss=s%60; return String(m).padStart(2,'0')+':'+String(ss).padStart(2,'0'); }
  function next(){ cur=(cur+1)%people; remain=secs; paint(); }
  function stopTick(){ if(tick){ clearInterval(tick); tick=null; } }
  function toggle(){
    running=!running;
    if(running){ tick=setInterval(()=>{ remain--; if(remain<=0){ beep(); next(); return; } paint(); }, 1000); }
    else stopTick();
    paint();
  }
  function reset(){ running=false; stopTick(); cur=0; remain=secs; paint(); }
  function paint(){
    el.innerHTML=`
      <div class="badge">순서 타이머</div>
      <div class="ctrl"><button class="btn g sm toladd">← 도구 목록</button>
        1인당 <input type="number" class="tsec" min="1" max="600" value="${secs}"> 초
        &nbsp;·&nbsp; 인원 <input type="number" class="tppl" min="1" max="30" value="${people}"> 명</div>
      <div style="text-align:center; margin:14px 0;">
        <div style="font-size:1.6rem; font-weight:800; color:var(--teal)">${cur+1}번 차례</div>
        <div style="font-size:4rem; font-weight:900; color:${remain<=5?'#ef476f':'var(--ink)'}; line-height:1.1">${mmss(remain)}</div>
      </div>
      <div class="nav2">
        <button class="btn p" id="tgo">${running?'⏸ 일시정지':'▶ 시작'}</button>
        <button class="btn g" id="tnext">다음 사람 ▶</button>
        <button class="btn g" id="trst">↺ 리셋</button>
      </div>
      <p class="hint">일렬로 줄 서서 ${cur+1}번부터 한 명씩 ${secs}초 안에! 시간이 끝나면 삐 소리와 함께 다음 사람으로 넘어가요. 마지막 사람 다음엔 다시 1번으로.</p>`;
    el.querySelector('.tsec').onchange=e=>{ secs=Math.max(1,Math.min(600,+e.target.value||1)); remain=secs; running=false; stopTick(); paint(); };
    el.querySelector('.tppl').onchange=e=>{ people=Math.max(1,Math.min(30,+e.target.value||1)); cur=0; running=false; stopTick(); paint(); };
    el.querySelector('.toladd').onclick=()=>{ el.hidden=true; document.getElementById('beanStage').hidden=false; };
    el.querySelector('#tgo').onclick=toggle;
    el.querySelector('#tnext').onclick=()=>{ remain=secs; next(); };
    el.querySelector('#trst').onclick=reset;
  }
  paint();
})();
</script>
</body>
</html>
