<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>정답표 (진행자용)</title>
<style>
  :root { --bg:#0f1220; --card:#1a1f36; --line:#2c3350; --fg:#eef1ff; --mut:#9aa3c7; --accent:#ffcc4d; --ok:#4ade80; --hot:#ff6b6b; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif; background:var(--bg); color:var(--fg); font-size:16px; }
  header { text-align:center; padding:20px 12px 6px; }
  h1 { margin:0; font-size:1.5rem; }
  .warn { color:var(--hot); font-size:.9rem; margin-top:6px; }
  main { max-width:860px; margin:0 auto; padding:8px 14px 60px; }
  h2 { font-size:1.25rem; margin:26px 0 10px; padding-bottom:6px; border-bottom:2px solid var(--accent); }
  h3 { font-size:1.02rem; color:var(--accent); margin:18px 0 6px; }
  .scroll { overflow-x:auto; }
  table.tbl { width:100%; border-collapse:collapse; margin:4px 0 14px; font-size:.98rem; }
  table.tbl th, table.tbl td { border:1px solid var(--line); padding:8px 10px; text-align:left; vertical-align:top; line-height:1.4; }
  table.tbl th { background:#232a4a; color:var(--accent); font-weight:800; white-space:nowrap; }
  table.tbl tr:nth-child(even) td { background:rgba(255,255,255,.028); }
  td.num { color:var(--mut); text-align:center; width:2.4rem; white-space:nowrap; }
  td.cho { color:var(--mut); font-weight:800; white-space:nowrap; width:34%; }
  td.ans { color:var(--accent); font-weight:800; }
  td.ox { text-align:center; font-weight:900; width:3rem; }
  td.ox.o { color:var(--ok); } td.ox.x { color:var(--hot); }
  td.note { color:var(--mut); font-size:.9rem; }
  a.home { color:var(--mut); }
</style>
</head>
<body>
<header>
  <h1>🔑 정답표 (진행자용)</h1>
  <div class="warn">⚠️ 이 페이지는 진행자만! 빔프로젝터에 띄우지 마세요.</div>
  <div style="margin-top:6px"><a class="home" href="./index.html">← 게임 화면으로</a></div>
</header>
<main id="app"></main>

<script src="data.js"></script>
<script>
const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
let html='';

// OX
html+='<h2>⭕❌ OX 퀴즈</h2><div class="scroll"><table class="tbl">'
    + '<thead><tr><th>#</th><th>문제</th><th>정답</th><th>해설</th></tr></thead><tbody>';
OX.forEach((o,i)=>{
  html+=`<tr><td class="num">${i+1}</td><td>${esc(o.q)}</td>`
      + `<td class="ox ${o.a?'o':'x'}">${o.a?'O':'X'}</td>`
      + `<td class="note">${o.e?esc(o.e):''}</td></tr>`;
});
html+='</tbody></table></div>';

// 초성 맞추기
html+='<h2>💡 초성 맞추기</h2>';
for(const [cat,list] of Object.entries(INITIALS)){
  html+=`<h3>${cat}</h3><table class="tbl"><thead><tr><th class="num">#</th><th>초성</th><th>정답</th></tr></thead><tbody>`;
  list.forEach(([q,a],i)=>{ html+=`<tr><td class="num">${i+1}</td><td class="cho">${esc(q)}</td><td class="ans">${esc(a)}</td></tr>`; });
  html+='</tbody></table>';
}

// 몸으로 말해요 (제시어)
html+='<h2>🤸 몸으로 말해요 (제시어)</h2>';
for(const [cat,list] of Object.entries(CHARADES)){
  html+=`<h3>${cat}</h3><table class="tbl"><thead><tr><th class="num">#</th><th>제시어</th><th class="num">#</th><th>제시어</th></tr></thead><tbody>`;
  for(let i=0;i<list.length;i+=2){
    const b=list[i+1];
    html+=`<tr><td class="num">${i+1}</td><td class="ans">${esc(list[i])}</td>`
        + (b!==undefined ? `<td class="num">${i+2}</td><td class="ans">${esc(b)}</td>` : '<td></td><td></td>')
        + '</tr>';
  }
  html+='</tbody></table>';
}

app.innerHTML=html;
</script>
</body>
</html>
