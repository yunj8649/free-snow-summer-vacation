<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>문제 편집 (진행자용)</title>
<style>
  :root { --bg:#0f1220; --card:#1a1f36; --line:#2c3350; --fg:#eef1ff; --mut:#9aa3c7; --accent:#ffcc4d; --ok:#4ade80; --hot:#ff6b6b; --blue:#5b8cff; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif; background:var(--bg); color:var(--fg); font-size:16px; }
  header { text-align:center; padding:18px 12px 6px; }
  h1 { margin:0; font-size:1.4rem; }
  .warn { color:var(--hot); font-size:.85rem; margin-top:6px; }
  main { max-width:820px; margin:0 auto; padding:8px 14px 90px; }
  h2 { font-size:1.15rem; margin:26px 0 10px; padding-bottom:6px; border-bottom:2px solid var(--accent); }
  .topic { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; margin:10px 0; }
  .topic-head { display:flex; gap:8px; align-items:center; margin-bottom:8px; }
  .topic-head input { flex:1; font-size:1rem; font-weight:700; padding:7px 10px; border-radius:8px; border:1px solid var(--line); background:#11152a; color:var(--fg); }
  textarea { width:100%; min-height:120px; padding:9px 11px; border-radius:8px; border:1px solid var(--line); background:#11152a; color:var(--fg); font-size:.95rem; line-height:1.5; resize:vertical; font-family:inherit; }
  .hintline { color:var(--mut); font-size:.82rem; margin:4px 0 0; }
  button { font-size:.9rem; padding:8px 13px; border-radius:8px; border:none; cursor:pointer; font-weight:700; }
  .del { background:transparent; color:var(--hot); border:1px solid var(--hot); padding:6px 10px; }
  .add { background:var(--blue); color:#fff; margin-top:6px; }
  .bar { position:fixed; left:0; right:0; bottom:0; background:#0b0e1a; border-top:1px solid var(--line); padding:12px; display:flex; gap:10px; justify-content:center; flex-wrap:wrap; z-index:10; }
  .apply { background:var(--ok); color:#06301b; }
  .export { background:var(--accent); color:#3a2c00; }
  .reset { background:transparent; color:var(--mut); border:1px solid var(--line); }
  a.home { color:var(--mut); }
  #out { display:none; margin-top:16px; }
  #out textarea { min-height:220px; font-family:ui-monospace,monospace; font-size:.8rem; }
  .status { text-align:center; color:var(--ok); min-height:20px; font-size:.9rem; margin-top:8px; }
</style>
</head>
<body>
<header>
  <h1>✏️ 문제 편집 (진행자용)</h1>
  <div class="warn">⚠️ 여기서 수정하면 <b>이 기기(브라우저)</b>에만 저장돼요. 모든 사람/모든 기기에 영구 반영하려면 "코드용 내보내기"로 뽑아서 개발자에게 전달하세요.</div>
  <div style="margin-top:6px"><a class="home" href="./index.html">← 게임 화면으로</a></div>
</header>
<main>
  <h2>🤸 몸으로 말해요 (제시어)</h2>
  <div id="charBox"></div>
  <button class="add" id="charAdd">+ 주제 추가</button>

  <h2>💡 초성 맞추기 <span class="hintline">— 정답만 입력하면 초성은 자동 생성돼요</span></h2>
  <div id="iniBox"></div>
  <button class="add" id="iniAdd">+ 주제 추가</button>

  <h2>⭕❌ OX 퀴즈</h2>
  <p class="hintline">한 줄에 하나씩 · 형식: <b>문제 | O</b> 또는 <b>문제 | X | 해설(선택)</b></p>
  <textarea id="oxArea" style="min-height:260px"></textarea>

  <div id="out"><h2>📋 코드용 내보내기</h2><p class="hintline">아래 내용을 전부 복사해서 개발자에게 전달하세요.</p><textarea id="outArea" readonly></textarea></div>
  <div class="status" id="status"></div>
</main>

<div class="bar">
  <button class="apply" id="btnApply">💾 이 기기에 적용</button>
  <button class="export" id="btnExport">📋 코드용 내보내기</button>
  <button class="reset" id="btnReset">↺ 기본값으로 복원</button>
</div>

<script src="data.js"></script>
<script>
const LEAD='ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';
function chosung(s){ let o=''; for(const ch of s){ if(ch===' '){o+=' ';continue;} const c=ch.charCodeAt(0); if(c>=0xAC00&&c<=0xD7A3) o+=LEAD[Math.floor((c-0xAC00)/588)]; } return o.replace(/ +/g,' ').trim(); }
const $=id=>document.getElementById(id);

// 모델 초기화 (data.js의 현재값 = override 적용된 값)
let charModel=Object.entries(CHARADES).map(([name,items])=>({name, items:items.slice()}));
let iniModel=Object.entries(INITIALS).map(([name,list])=>({name, answers:list.map(p=>p[1])}));

function topicEl(t, kind){
  const div=document.createElement('div'); div.className='topic';
  const placeholder = kind==='ini' ? '정답 (한 줄에 하나)' : '제시어 (한 줄에 하나)';
  const body = kind==='ini' ? t.answers.join('\n') : t.items.join('\n');
  div.innerHTML=`<div class="topic-head"><input class="tname" value="${t.name.replace(/"/g,'&quot;')}"><button class="del">삭제</button></div>
    <textarea class="tbody" placeholder="${placeholder}">${body}</textarea>`;
  div.querySelector('.del').onclick=()=>{ scrape(); (kind==='ini'?iniModel:charModel).splice(indexOf(div,kind),1); render(kind); };
  return div;
}
function indexOf(div, kind){ const box=kind==='ini'?$('iniBox'):$('charBox'); return [...box.children].indexOf(div); }
function render(kind){
  const box = kind==='ini'?$('iniBox'):$('charBox');
  const model = kind==='ini'?iniModel:charModel;
  box.innerHTML=''; model.forEach(t=>box.appendChild(topicEl(t,kind)));
}
function scrape(){
  charModel=[...$('charBox').children].map(d=>({ name:d.querySelector('.tname').value.trim(),
    items:d.querySelector('.tbody').value.split('\n').map(s=>s.trim()).filter(Boolean) }));
  iniModel=[...$('iniBox').children].map(d=>({ name:d.querySelector('.tname').value.trim(),
    answers:d.querySelector('.tbody').value.split('\n').map(s=>s.trim()).filter(Boolean) }));
}
function buildData(){
  scrape();
  const CH={}; charModel.forEach(t=>{ if(t.name) CH[t.name]=t.items; });
  const IN={}; iniModel.forEach(t=>{ if(t.name) IN[t.name]=t.answers.map(a=>[chosung(a),a]); });
  const OXm=$('oxArea').value.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{
    const p=l.split('|').map(s=>s.trim());
    const o={ q:p[0], a:/^o$/i.test(p[1]||'') };
    if(p[2]) o.e=p[2];
    return o;
  });
  return {CHARADES:CH, INITIALS:IN, OX:OXm};
}

render('char'); render('ini');
$('oxArea').value = OX.map(o=> o.q+' | '+(o.a?'O':'X') + (o.e?(' | '+o.e):'')).join('\n');
$('charAdd').onclick=()=>{ scrape(); charModel.push({name:'🆕 새 주제', items:[]}); render('char'); };
$('iniAdd').onclick =()=>{ scrape(); iniModel.push({name:'🆕 새 주제', answers:[]}); render('ini'); };

$('btnApply').onclick=()=>{
  const d=buildData();
  localStorage.setItem('fss_override', JSON.stringify(d));
  $('status').textContent='✅ 이 기기에 저장했어요. 게임 화면에서 바로 반영돼요.';
};
$('btnExport').onclick=()=>{
  const d=buildData();
  $('outArea').value=JSON.stringify(d, null, 2);
  $('out').style.display='block';
  $('outArea').select();
  try{ document.execCommand('copy'); $('status').textContent='📋 복사했어요. 개발자에게 전달하세요.'; }
  catch(e){ $('status').textContent='아래 내용을 전부 복사해서 개발자에게 전달하세요.'; }
  $('out').scrollIntoView({behavior:'smooth'});
};
$('btnReset').onclick=()=>{
  if(!confirm('이 기기의 수정본을 지우고 기본값으로 되돌릴까요?')) return;
  localStorage.removeItem('fss_override'); location.reload();
};
</script>
</body>
</html>
